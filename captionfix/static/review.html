<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review captions</title>
<style>
  :root { --blue: #0b5cff; --ink: #131619; --muted: #5d6670; --line: #e2e6eb; --bg: #f6f8fa; --ok: #12805c; --warn: #b4530a; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  header { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid var(--line); }
  .bar { max-width: 880px; margin: 0 auto; padding: 14px 20px; display: flex; gap: 16px; align-items: center; }
  .bar h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .bar .meta { color: var(--muted); font-size: 13px; }
  .progress { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .progress div { height: 100%; background: var(--blue); width: 0; transition: width .2s; }
  button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  main { max-width: 880px; margin: 0 auto; padding: 20px; }
  .help { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .item { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .item.done { opacity: .6; }
  .item.current { border-color: var(--blue); box-shadow: 0 0 0 3px #0b5cff22; }
  .row { display: flex; gap: 10px; align-items: center; }
  .time { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); }
  .words { margin: 8px 0; }
  .w.low { background: #fff1cc; border-radius: 3px; }
  .w.fix { background: #dfeaff; border-radius: 3px; }
  .w.fix::after { content: " (was: " attr(data-was) ")"; color: var(--muted); font-size: 12px; }
  .w.doubt { text-decoration: underline dotted 2px #b7791f; text-underline-offset: 3px; }
  .w.doubt::after { content: " (also heard: " attr(data-heard) ")"; color: #b7791f; font-size: 12px; }
  textarea { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 8px; resize: vertical; }
  .status { margin-left: auto; font-size: 13px; }
  .status.ok { color: var(--ok); } .status.edited { color: var(--warn); }
  kbd { font: 12px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; background: #fff; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Review captions</h1>
    <span class="meta" id="meta"></span>
    <div class="progress"><div id="progress"></div></div>
    <span class="meta" id="count"></span>
    <button class="primary" id="export">Export captions</button>
  </div>
</header>
<main>
  <p class="help">Only the stretches most likely to be wrong are listed. Play one, fix the text if needed, and save.
    Dotted words are course terms the second model heard differently; blue words were changed after checking the audio.
    Keys: <kbd>space</kbd> play, <kbd>j</kbd>/<kbd>k</kbd> next and previous, <kbd>enter</kbd> looks right.</p>
  <div id="list"></div>
</main>
<audio id="audio" src="/recording" preload="metadata"></audio>
<script>
const audio = document.getElementById("audio");
let items = [], current = 0, stopAt = null;

const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

async function load() {
  const data = await (await fetch("/api/review")).json();
  items = data.stretches;
  document.getElementById("meta").textContent =
    `${data.run.minutes} min lecture · ${data.run.review_minutes} min to check · ${data.run.corrections} corrections`;
  // #t=2037 opens the list at the stretch around that second, so a stretch can be linked
  const at = +(location.hash.match(/t=([\d.]+)/) || [])[1];
  if (at) current = Math.max(0, items.findIndex(it => it.end >= at));
  render();
  if (at) document.querySelectorAll(".item")[current].scrollIntoView({block: "center"});
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  items.forEach((it, i) => {
    const div = document.createElement("div");
    div.className = "item" + (it.edit ? " done" : "") + (i === current ? " current" : "");
    const words = it.words.map(w => {
      const flags = w.flags || [];
      const cls = flags.includes("corrected") ? "w fix" : flags.includes("doubt") ? "w doubt" : w.prob < 0.5 ? "w low" : "w";
      const was = w.original ? ` data-was="${esc(w.original)}"` : "";
      const heard = w.heard ? ` data-heard="${esc(w.heard)}"` : "";
      return `<span class="${cls}"${was}${heard}>${esc(w.text)}</span>`;
    }).join(" ");
    const text = it.edit ? it.edit.text : it.words.map(w => w.text).join(" ");
    div.innerHTML = `
      <div class="row"><button data-play>▶ ${fmt(it.start)}</button>
        <span class="time">${(it.end - it.start).toFixed(1)} s</span>
        <span class="status ${it.edit ? it.edit.status : ""}">${it.edit ? (it.edit.status === "ok" ? "looks right" : "edited") : ""}</span></div>
      <div class="words">${words}</div>
      <textarea rows="2">${esc(text)}</textarea>
      <div class="row" style="margin-top:8px"><button data-ok>Looks right</button><button data-save class="primary">Save edit</button></div>`;
    div.querySelector("[data-play]").onclick = () => play(i);
    div.querySelector("[data-ok]").onclick = () => save(i, "ok");
    div.querySelector("[data-save]").onclick = () => save(i, "edited");
    div.onclick = e => { if (e.target.tagName !== "BUTTON") current = i; };
    list.appendChild(div);
  });
  const done = items.filter(it => it.edit).length;
  document.getElementById("count").textContent = `${done} / ${items.length}`;
  document.getElementById("progress").style.width = `${items.length ? 100 * done / items.length : 0}%`;
}

function play(i) {
  current = i;
  audio.currentTime = Math.max(0, items[i].start - 1);
  stopAt = items[i].end + 1;
  audio.play();
}
audio.ontimeupdate = () => { if (stopAt && audio.currentTime >= stopAt) { audio.pause(); stopAt = null; } };

async function save(i, status) {
  const original = items[i].words.map(w => w.text).join(" ");
  let text = document.querySelectorAll("textarea")[i].value.trim();
  if (status === "ok") text = original;
  if (status === "edited" && text === original) status = "ok";
  await fetch(`/api/review/${i}`, {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify({text, status})});
  items[i].edit = {text, status};
  current = Math.min(i + 1, items.length - 1);
  render();
  document.querySelectorAll(".item")[current]?.scrollIntoView({block: "center", behavior: "smooth"});
}

document.getElementById("export").onclick = async () => {
  const r = await (await fetch("/api/export", {method: "POST"})).json();
  alert(`Saved ${r.file}\n${r.checked} of ${r.total} stretches checked.`);
};

document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  if (e.key === " ") { e.preventDefault(); play(current); }
  if (e.key === "j") { current = Math.min(current + 1, items.length - 1); render(); }
  if (e.key === "k") { current = Math.max(current - 1, 0); render(); }
  if (e.key === "Enter") save(current, "ok");
});

load();
</script>
</body>
</html>
